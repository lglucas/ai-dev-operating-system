name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  os-self-test:
    runs-on: ubuntu-latest
    name: OS coherence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Canonical structure, frontmatter coverage across skills/agents/commands,
      # relative link integrity, registry ↔ INDEX consistency, session-log indexing,
      # hooks wiring, gitignore hygiene. Exits non-zero on any error.
      - name: Run os-self-test
        run: node scripts/os-self-test.js

      # Unit tests for the hooks and the catalogue generator. Node's built-in runner —
      # no dependencies, nothing to install.
      #
      # The glob is UNQUOTED on purpose, so the shell expands it. Passing the directory
      # makes Node resolve it as a module path ("Cannot find module"), and quoting the
      # glob only works on Node 21+, which added glob support to --test. Node 20 reports
      # "Could not find '.../scripts/test/*.test.js'". Shell expansion works everywhere.
      - name: Script unit tests
        run: node --test scripts/test/*.test.js

      # Fails when CODEMAP.md drifts from the code. A stale codemap is worse than none:
      # the agent trusts it, skips reading, and acts on wrong information.
      # Inside this repo the script self-skips — the OS ships the machinery, the derived
      # project owns the map — so here this step only proves the script still runs.
      - name: Codemap up to date
        run: node scripts/codemap.js --check

  lint-docs:
    runs-on: ubuntu-latest
    name: Markdown structure & links
    steps:
      - uses: actions/checkout@v4

      - name: Check canonical structure
        run: |
          echo "Verifying canonical .claude/ structure..."
          for d in .claude/agents .claude/rules .claude/skills .claude/commands; do
            if [ ! -d "$d" ]; then
              echo "::error::Missing canonical directory: $d"
              exit 1
            fi
          done
          for f in CLAUDE.md START-HERE.md WIZARD.md README.md CHANGELOG.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "Canonical structure OK."

      - name: Reject root duplicates of .claude/ folders
        run: |
          for d in agents rules skills commands; do
            if [ -d "$d" ] && [ -d ".claude/$d" ]; then
              echo "::error::Root duplicate detected: ./$d (canonical lives in .claude/$d)"
              exit 1
            fi
          done

      - name: Reject committed secrets / archives / OS junk
        run: |
          set -e
          if git ls-files | grep -E '\.(env|env\.local|env\.production)$' ; then
            echo "::error::.env file committed."
            exit 1
          fi
          if git ls-files | grep -E '\.(zip|tar\.gz|7z|rar)$' ; then
            echo "::error::Archive file committed."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini)$' ; then
            echo "::error::OS junk file committed."
            exit 1
          fi
          echo "Hygiene check OK."

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # docs/selfhosted/catalog/ is excluded on purpose: it is a generated mirror of
          # 1.346 third-party project URLs from awesome-selfhosted. We do not control those
          # hosts, and a handful always fail CI for TLS, HTTP/2 or plain downtime — none of
          # which is a defect in this repo. Upstream already runs its own dead-link checker,
          # and `node scripts/sync-selfhosted.js` pulls the cleaned result.
          args: >-
            --no-progress
            --exclude-loopback
            --exclude-path docs/selfhosted/catalog
            --exclude 'github\.com/lglucas/boringco'
            --exclude 'linkedin\.com'
            --exclude 'lume\.ufrgs\.br'
            --exclude 'perestroika\.com\.br'
            --max-retries 3
            --retry-wait-time 5
            '**/*.md'
          fail: true
